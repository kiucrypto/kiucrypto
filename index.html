            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
        }

        }

            z-index: -1;
        }

        @keyframes pulso-fondo {
            0% { background-size: 100% 100%; }
            100% { background-size: 120% 120%; }
        }

        header {
            width: 100%;
            padding: 24px 20px;
            text-align: center;
            z-index: 10; /* Al frente */
        }

        .top-domain {
            font-family: 'Cinzel', serif;
            font-size: 1.05rem;
            letter-spacing: 4px;
            color: #d1d5db;
            text-transform: lowercase;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
        }

        main {
            width: 100%;
            max-width: 650px;
            padding: 5px 20px 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 22px;
            z-index: 10; /* Al frente */
        }

        .coin-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 550px;
            margin: 15px auto;
        }

        .side-text-left, .side-text-right {
            display: none; 
        }

        /* MONEDA: INTERACCIÓN FLUIDA Y SEGURA */
        .coin-container {
            position: relative;
            width: 230px;
            height: 230px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5; /* Por encima del fondo, por debajo de los textos principales */
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Efecto de inclinación sutil al pasar el mouse */
        .coin-container:hover {
            transform: scale(1.05) rotateY(5deg);
        }

        .coin-galaxy-bg {
            position: absolute;
            width: 170px;
            height: 170px;
            border-radius: 50%;
            /* Gradiente profundo profesional */
            background: conic-gradient(from 0deg, #660000, #ff1a40, #330000, #990033, #660000);
            filter: blur(18px);
            opacity: 0.85;
        }

        .coin-yellow-ring {
            position: absolute;
            width: 195px;
            height: 195px;
            border-radius: 50%;
            border: 2px dashed rgba(255, 26, 64, 0.7);
            animation: girar-anillo 12s linear infinite reverse;
        }

        @keyframes girar-anillo {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .coin-red-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px dotted rgba(210, 180, 140, 0.6);
            animation: girar-rojo 8s linear infinite;
        }

        @keyframes girar-rojo {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .coin-img {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
            border: 2px solid rgba(210, 180, 140, 0.8);
            position: relative;
            z-index: 4;
        }

        .title-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            z-index: 10; /* Al frente */
        }

        .title-kiu {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .project-status {
            font-size: 0.8rem;
            color: #ff4d6d;
            letter-spacing: 1px;
            background: rgba(220, 20, 60, 0.08);
            border: 1px solid rgba(220, 20, 60, 0.3);
            padding: 6px 14px;
            border-radius: 30px;
            display: inline-block;
            margin: 0 auto;
        }

        .info-card {
            width: 100%;
            background: rgba(12, 12, 12, 0.92);
            border: 1px solid rgba(220, 20, 60, 0.25);
            border-radius: 18px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            text-align: left;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            z-index: 10; /* Al frente */
            backdrop-filter: blur(5px);
        }

        .info-block {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .info-label {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: #9ca3af;
            font-weight: 600;
        }

        .info-value {
            font-size: 0.92rem;
            line-height: 1.5;
            color: #e5e7eb;
        }

        .founder-block {
            display: flex;
            flex-direction: column;
            gap: 4px;
            border-top: 1px solid rgba(220, 20, 60, 0.2);
            padding-top: 12px;
        }

        /* FUNDADOR: CIAN NEÓN LIMPIO Y RESALTANTE */
        .founder-name-text {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            color: #38bdf8;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 4px;
            width: 100%;
        }

        .btn-buy-kiu {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #e11d48, #9f1239);
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-align: center;
            box-shadow: 0 0 20px rgba(225, 29, 72, 0.35);
            transition: transform 0.2s ease;
        }

        .btn-buy-kiu:hover {
            transform: translateY(-2px);
        }

        .btn-solscan {
            display: block;
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(220, 20, 60, 0.4);
            color: #fca5a5;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.88rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            transition: background 0.2s ease;
        }

        .btn-solscan:hover {
            background: rgba(220, 20, 60, 0.1);
        }

        footer {
            width: 100%;
            padding: 20px;
            text-align: center;
            border-top: 1px solid rgba(220, 20, 60, 0.2);
            background: rgba(0, 0, 0, 0.95);
            z-index: 10; /* Al frente */
        }

            font-size: 1rem;
