<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiu Crypto | Official Project</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
        }

        /* FONDO: GALAXIA VIVA CON MOVIMIENTO FLUIDO */
        .crypto-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(138, 43, 226, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 80% 70%, rgba(0, 168, 204, 0.12) 0%, transparent 45%),
                radial-gradient(rgba(255, 0, 60, 0.2) 2.5px, transparent 2.5px),
                radial-gradient(rgba(255, 204, 0, 0.18) 3.5px, transparent 3.5px);
            background-size: 100% 100%, 100% 100%, 70px 70px, 110px 110px;
            background-position: 0 0, 0 0, 0 0, 40px 40px;
            z-index: -3;
            animation: mover-fondo 22s linear infinite;
        }

        @keyframes mover-fondo {
            0% { background-position: 0 0, 0 0, 0 0, 40px 40px; }
            100% { background-position: 0 0, 0 0, 0 180px, 110px 220px; }
        }

        /* PALABRAS "KIU" TRANSPARENTES CAYENDO EN EL FONDO */
        .kiu-floating-text {
            position: fixed;
            top: -10%;
            left: 0;
            width: 100%;
            height: 120%;
            background-image: radial-gradient(rgba(255, 204, 0, 0.04) 2px, transparent 2px);
            background-size: 200px 200px;
            z-index: -2;
            pointer-events: none;
            font-family: 'Cinzel', serif;
            color: rgba(255, 255, 255, 0.04);
            font-size: 1.5rem;
            font-weight: 800;
            overflow: hidden;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-content: space-around;
            animation: caer-kiu 16s linear infinite;
        }

        @keyframes caer-kiu {
            0% { transform: translateY(-50px); }
            100% { transform: translateY(150px); }
        }

        header {
            width: 100%;
            padding: 24px 20px;
            text-align: center;
            z-index: 2;
        }

        .top-domain {
            font-family: 'Cinzel', serif;
            font-size: 1.05rem;
            letter-spacing: 4px;
            color: #d1d5db;
            text-transform: lowercase;
            font-weight: 600;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.25);
            opacity: 0.9;
        }

        main {
            width: 100%;
            max-width: 650px;
            padding: 5px 20px 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 22px;
            z-index: 2;
        }

        .coin-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 550px;
            margin: 15px auto;
        }

        /* EN MÓVILES SE OCULTAN. SOLO APARECEN EN LAPTOP CON EL EFECTO DE APAGARSE/PRENDERSE SOBRIO */
        .side-text-left, .side-text-right {
            display: none; 
        }

        .coin-container {
            position: relative;
            width: 230px;
            height: 230px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .coin-galaxy-bg {
            position: absolute;
            width: 170px;
            height: 170px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #ff0055, #ffcc00, #00ffff, #9900ff, #ff0055);
            filter: blur(14px);
            opacity: 0.85;
            z-index: 1;
        }

        .coin-yellow-ring {
            position: absolute;
            width: 195px;
            height: 195px;
            border-radius: 50%;
            border: 3px dashed #ffcc00;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.5);
            animation: girar-amarillo 9s linear infinite reverse;
            z-index: 2;
        }

        @keyframes girar-amarillo {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .coin-red-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px dotted #ff0033;
            box-shadow: 0 0 25px rgba(255, 0, 51, 0.7), inset 0 0 15px rgba(255, 0, 51, 0.3);
            animation: girar-rojo 6s linear infinite;
            z-index: 3;
        }

        @keyframes girar-rojo {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .coin-img {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
            border: 3px solid #ffcc00;
            position: relative;
            z-index: 4;
        }

        .title-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        .title-kiu {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .project-status {
            font-size: 0.8rem;
            color: #ffcc00;
            letter-spacing: 1px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 204, 0, 0.25);
            padding: 6px 14px;
            border-radius: 30px;
            display: inline-block;
            margin: 0 auto;
            backdrop-filter: blur(5px);
        }

        .info-card {
            width: 100%;
            background: rgba(18, 18, 18, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 204, 0, 0.2);
            border-radius: 18px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            text-align: left;
        }

        .info-block {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .info-label {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: #a0aec0;
            font-weight: 600;
        }

        .info-value {
            font-size: 0.92rem;
            line-height: 1.5;
            color: #e2e8f0;
        }

        .founder-block {
            display: flex;
            flex-direction: column;
            gap: 4px;
            border-top: 1px solid rgba(255, 204, 0, 0.2);
            padding-top: 12px;
        }

        /* COLOR DEL FUNDADOR: TONO NEÓN GALÁCTICO RESALTANTE Y ELEGANTE */
        .founder-name-text {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            color: #00f0ff;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 4px;
            width: 100%;
        }

            width:
