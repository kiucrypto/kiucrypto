<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiu Crypto | Official Project</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
        }

        /* FONDO CON BURBUJAS EN MOVIMIENTO */
        .crypto-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            background-image: 
                radial-gradient(rgba(255, 90, 90, 0.4) 2.5px, transparent 2.5px),
                radial-gradient(rgba(255, 120, 120, 0.25) 4px, transparent 4px),
                radial-gradient(rgba(255, 204, 0, 0.15) 1.5px, transparent 1.5px);
            background-size: 80px 80px, 140px 140px, 40px 40px;
            background-position: 0 0, 40px 40px, 20px 20px;
            z-index: -3;
            animation: mover-burbujas 25s linear infinite;
        }

        @keyframes mover-burbujas {
            0% { background-position: 0 0, 40px 40px, 20px 20px; }
            100% { background-position: 0 160px, 140px 200px, 40px 120px; }
        }

        /* MARCA DE AGUA "KIU" */
        .watermark-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Cinzel', serif;
            font-size: 20vw;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.02);
            z-index: -2;
            pointer-events: none;
            user-select: none;
            text-align: center;
            width: 100%;
        }

        header {
            width: 100%;
            padding: 20px;
            text-align: center;
            z-index: 2;
        }

        .top-domain {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            letter-spacing: 3px;
            color: #ffcc00;
            text-transform: lowercase;
            font-weight: 700;
        }

        main {
            width: 100%;
            max-width: 600px;
            padding: 10px 20px 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 25px;
            z-index: 2;
        }

        /* CONTENEDOR DE LA MONEDA MÁS GRANDE CON ARO DE FUEGO CIRCULAR */
        .coin-container {
            position: relative;
            width: 175px;
            height: 175px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px auto;
        }

        .coin-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px dashed transparent;
            border-top-color: #ff3300;
            border-right-color: #ff9900;
            border-bottom-color: #ffcc00;
            box-shadow: 0 0 25px rgba(255, 100, 0, 0.6), inset 0 0 15px rgba(255, 204, 0, 0.4);
            animation: fuego-circular 2s linear infinite;
        }

        @keyframes fuego-circular {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .coin-img {
            width: 145px;
            height: 145px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 0 35px rgba(255, 150, 0, 0.5);
            border: 3px solid #ffcc00;
            position: relative;
            z-index: 2;
        }

        .title-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .title-kiu {
            font-family: 'Cinzel', serif;
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .project-status {
            font-size: 0.85rem;
            color: #ffcc00;
            letter-spacing: 0.5px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 204, 0, 0.2);
            padding: 6px 14px;
            border-radius: 30px;
            display: inline-block;
            margin: 0 auto;
        }

        .info-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 204, 0, 0.2);
            border-radius: 16px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.8);
            text-align: left;
        }

        .info-block {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .info-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #a0aec0;
        }

        .info-value {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #ffffff;
        }

        .founder-block {
            display: flex;
            flex-direction: column;
            gap: 4px;
            border-top: 1px solid rgba(255, 204, 0, 0.2);
            padding-top: 12px;
        }

        .founder-name-text {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            color: #ffcc00;
            font-weight: 700;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 5px;
            width: 100%;
        }

        .btn-buy-kiu {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ffcc00, #ff9900);
            color: #000000;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 800;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.5);
        }

        .btn-solscan {
            display: block;
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid #ffcc00;
            color: #ffcc00;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        footer {
            width: 100%;
            padding: 20px;
            text-align: center;
            border-top: 1px solid rgba(255, 204, 0, 0.2);
            background: rgba(0, 0, 0, 0.95);
            z-index: 2;
        }

        .footer-domain {
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            color: #ffcc00;
            letter-spacing: 2px
