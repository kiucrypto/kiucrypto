<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiu Crypto | Official Project</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
        }

        /* FONDO ESTRELLA / PUNTOS EN MOVIMIENTO LIGERO Y RÁPIDO */
        .crypto-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(220, 20, 60, 0.15) 0%, transparent 45%),
                radial-gradient(rgba(255, 0, 60, 0.3) 2px, transparent 2px),
                radial-gradient(rgba(255, 255, 255, 0.2) 1.5px, transparent 1.5px);
            background-size: 100% 100%, 80px 80px, 120px 120px;
            background-position: 0 0, 0 0, 40px 40px;
            z-index: -1;
            animation: mover-estrellas 20s linear infinite;
        }

        @keyframes mover-estrellas {
            0% { background-position: 0 0, 0 0, 40px 40px; }
            100% { background-position: 0 0, 0 160px, 40px 200px; }
        }

        header {
            width: 100%;
            padding: 24px 20px;
            text-align: center;
            z-index: 10;
        }

        .top-domain {
            font-family: 'Cinzel', serif;
            font-size: 1.05rem;
            letter-spacing: 4px;
            color: #d1d5db;
            text-transform: lowercase;
            font-weight: 600;
        }

        main {
            width: 100%;
            max-width: 650px;
            padding: 5px 20px 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 22px;
            z-index: 10;
        }

        .coin-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 550px;
            margin: 15px auto;
        }

        .coin-container {
            position: relative;
            width: 230px;
            height: 230px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .coin-galaxy-bg {
            position: absolute;
            width: 170px;
            height: 170px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #ff0033, #800020, #ff1a40, #400010, #ff0033);
            filter: blur(14px);
            opacity: 0.85;
        }

        .coin-img {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 0 25px rgba(255, 0, 51, 0.6);
            border: 2px solid #ff1a40;
            position: relative;
            z-index: 2;
        }

        .title-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        .title-kiu {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .project-status {
            font-size: 0.8rem;
            color: #ff4d6d;
            letter-spacing: 1px;
            background: rgba(255, 0, 51, 0.08);
            border: 1px solid rgba(255, 0, 51, 0.3);
            padding: 6px 14px;
            border-radius: 30px;
            display: inline-block;
            margin: 0 auto;
        }

        .info-card {
            width: 100%;
            background: rgba(12, 12, 12, 0.9);
            border: 1px solid rgba(255, 0, 51, 0.25);
            border-radius: 18px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            text-align: left;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
        }

        .info-block {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .info-label {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: #9ca3af;
            font-weight: 600;
        }

        .info-value {
            font-size: 0.92rem;
            line-height: 1.5;
            color: #e5e7eb;
        }

        .founder-block {
            display: flex;
            flex-direction: column;
            gap: 4px;
            border-top: 1px solid rgba(255, 0, 51, 0.2);
            padding-top: 12px;
        }

        /* FUNDADOR: AZUL CIAN NEÓN RESALTANTE */
        .founder-name-text {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            color: #38bdf8;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 4px;
            width: 100%;
        }

            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #e11d48, #9f
