        /* FONDO EXÓTICO: CAPAS DE FLUIDO ROJO/NEGRO EN MOVIMIENTO LENTO */
        .crypto-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            z-index: -1;
        }

        .crypto-bg::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background-image: 
                radial-gradient(circle at center, #8b0000 0%, transparent 25%),
                radial-gradient(circle at center, #330000 0%, transparent 50%),
                radial-gradient(circle at center, #000000 0%, transparent 70%);
            background-position: 0 0, 50px 50px, 100px 100px;
            background-size: 100% 100%, 150% 150%, 200% 200%;
            animation: fluido-exotico 60s linear infinite;
            opacity: 0.6;
        }

        @keyframes fluido-exotico {
            0% { transform: rotate(0deg) translate(0%, 0%); }
            25% { transform: rotate(5deg) translate(-2%, 2%); }
            50% { transform: rotate(0deg) translate(0%, 3%); }
            75% { transform: rotate(-5deg) translate(2%, 2%); }
            100% { transform: rotate(0deg) translate(0%, 0%); }
        }

        /* PARTÍCULAS DE CRISTAL (El efecto WOW al hacer clic) */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        header {
            width: 100%;
            padding: 24px 20px;
            text-align: center;
            z-index: 10;
        }

        .top-domain {
            font-family: 'Cinzel', serif;
            font-size: 1.05rem;
            letter-spacing: 6px;
            color: #d1d5db;
            text-transform: lowercase;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        main {
            width: 100%;
            max-width: 650px;
            padding: 5px 20px 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 22px;
            z-index: 10;
        }

        .coin-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 550px;
            margin: 15px auto;
        }

        .side-text-left, .side-text-right {
            display: none;
        }

        /* MONEDA CON INTERACCIÓN MAGNÉTICA */
        .coin-container {
            position: relative;
            width: 230px;
            height: 230px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease-out;
            transform-style: preserve-3d;
        }

        /* Al pasar el mouse, la moneda se inclina ligeramente hacia el cursor */
        .coin-container:hover {
            transform: perspective(600px) rotateY(10deg) rotateX(5deg);
        }

        .coin-galaxy-bg {
            position: absolute;
            width: 170px;
            height: 170px;
            border-radius: 50%;
            /* Gradiente exótico profundo */
            background: conic-gradient(from 0deg, #580000, #ff1a40, #220000, #990033, #580000);
            filter: blur(20px);
            opacity: 0.9;
            animation: pulso-brillo 5s infinite alternate;
        }

        @keyframes pulso-brillo {
            0% { opacity: 0.7; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1.02); }
        }

        .coin-yellow-ring {
            position: absolute;
            width: 195px;
            height: 195px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #ff4d4d;
            border-bottom-color: #ffcc66;
            animation: girar-anillo 10s linear infinite;
        }

        .coin-red-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-left-color: #ff0033;
            animation: girar-rojo 5s linear infinite reverse;
        }

        @keyframes girar-anillo { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes girar-rojo { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .coin-img {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 0 40px rgba(255, 0, 51, 0.6);
            border: 3px solid #ffffff;
            position: relative;
            z-index: 4;
            transition: transform 0.3s ease;
        }

        .coin-container:hover .coin-img {
            box-shadow: 0 0 60px rgba(255, 77, 77, 0.9);
            border-color: #ffcc66;
        }

        .title-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        /* TIPOGRAFÍA CON EFECTO DE GLITCH SUTIL */
        .title-kiu {
            font-family: 'Cinzel', serif;
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: 4px;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
            position: relative;
            animation: glitch-texto 5s infinite;
        }

        /* Efecto Glitch solo visible en laptop por rendimiento */
        @media (min-width: 768px) {
            @keyframes glitch-texto {
                0%, 96%, 100% { text-shadow: 0 0 15px rgba(255, 255, 255, 0.8); }
                97% { text-shadow: 5px 0 #ff0033, -5px 0 #00ffff; transform: skewX(10deg); }
                98% { text-shadow: -5px 0 #ff0033, 5px 0 #00ffff; transform: skewX(-10deg); }
                99% { text-shadow: none; transform: skewX(0deg); opacity: 0.1; }
            }
        }

        .project-status {
            font-size: 0.8rem;
            color: #ff8080;
            letter-spacing: 2px;
            background: rgba(255, 0, 51, 0.05);
            border: 1px solid rgba(255, 0, 51, 0.4);
            padding: 8px 16px;
            border-radius: 30px;
            display: inline-block;
            margin: 0 auto;
            font-weight: 500;
        }

            flex-direction: column;

            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
